  PROTOTYPE - throwaway. Non e' codice di produzione.
  Domanda: come dovrebbe apparire `df ui` (SPEC.md, sezione "UI locale")?
  Tre varianti radicalmente diverse sulla stessa pagina, switch con ?variant=A|B|C (barra in basso o frecce).
  ?mode=live (run in corso, dati che scorrono) | ?mode=done (mattino dopo, run fermato per stall).
  Dati finti, nessuna persistenza, azioni (pausa/resume/abort) solo stub in memoria.
  Avvio: open prototypes/df-ui.html  (serve rete per Preact+htm da unpkg)
-->

<style>
  :root {

    --tested:#14b8a6; --contract:#f97316;

  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .muted { color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  .panel > h3 { margin:0; padding:6px 10px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center; }
  .panel > .body { padding:8px 10px; overflow:auto; min-height:0; flex:1; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 8px; cursor:pointer; font:inherit; }
  button:hover { border-color:#3a4150; }
  button.on { background:#2a3140; border-color:#4b5263; }
  .pill { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; line-height:17px; white-space:nowrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .bar { height:6px; background:#262b36; border-radius:3px; overflow:hidden; width:110px; display:inline-block; vertical-align:middle; }
  .bar > i { display:block; height:100%; }
  table { border-collapse:collapse; width:100%; }
  td, th { padding:3px 6px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:11px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); padding:0 6px; }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--muted); padding:6px 10px; }
  .tabs button.on { color:var(--text); border-bottom-color:var(--running); }
  .clickable { cursor:pointer; }
  .clickable:hover { background:#20252f; }
  .sel { outline:1px solid var(--running); background:#1b2433 !important; }

  /* switcher (non fa parte del design) */
  #switcher { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:999;
    background:#fff; color:#111; border-radius:999px; padding:6px 10px; display:flex; gap:8px; align-items:center;
    box-shadow:0 6px 24px rgba(0,0,0,.5); font:12px ui-monospace, Menlo, monospace; }
  #switcher button { background:#eee; color:#111; border:1px solid #ccc; border-radius:999px; padding:2px 10px; }
  #switcher button.on { background:#111; color:#fff; }
  #switcher .lbl { min-width:190px; text-align:center; font-weight:600; }
  #statebox { position:fixed; bottom:60px; left:50%; transform:translateX(-50%); width:min(900px,92vw); max-height:50vh; overflow:auto;
    background:#fff; color:#111; border-radius:8px; padding:10px; z-index:998; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #statebox pre { font-size:11px; }
</style>

  const base = STREAM_POOL.slice(0, 5).map((l, i) => `[${clock(141 + i)}] ${l}`);

/* ------------------------------------------------------------------ pezzi condivisi */

const Dot = ({ st }) => html`<span class="dot" style=${{ background: COLORS[st] || 'var(--pending)' }}></span>`;
const Pill = ({ st, label }) => html`<span class="pill" style=${{ background: COLORS[st] || 'var(--pending)', color: '#0b0d10' }}>${label || st}</span>`;
const Bar = ({ v, max, color }) => html`<span class="bar"><i style=${{ width: Math.min(100, v / max * 100) + '%', background: color || 'var(--running)' }}></i></span>`;

function Actions({ ctx }) {
  const { data, act } = ctx;
  const live = data.run.status === 'running' || data.run.status === 'paused';
  if (!live) return html`<span class="muted">run terminato - sola lettura</span>`;
  return html`<span style=${{ display: 'flex', gap: '4px' }}>
    ${data.run.status === 'paused'
      ? html`<button onClick=${() => act('resume')}>Resume</button>`
      : html`<button onClick=${() => act('pause')} title="al confine di nodo">Pausa</button>`}
    <button onClick=${() => act('abort')} style=${{ color: 'var(--fail)' }}>Abort</button>
  </span>`;
}

function Header({ ctx }) {
  const r = ctx.data.run;
  return html`<div class="panel" style=${{ flexDirection: 'row', alignItems: 'center', gap: '18px', padding: '8px 12px', flexWrap: 'wrap' }}>
    <span><b class="mono">${r.spec}</b> <span class="muted mono">run ${r.id}</span></span>
    <${Pill} st=${{ running: 'running', paused: 'pending', stopped: 'esc', aborted: 'fail', done: 'ok' }[r.status]} label=${r.status} />
    <span class="mono">ROUND ${r.round}/${r.maxRounds} - wave ${r.wave}</span>
    <span class="mono">${usd(r.cost)} / ${r.budget} <${Bar} v=${r.cost} max=${r.budget} /></span>
    <span class="mono">${dur(r.elapsed)} / ${dur(r.wall)} <${Bar} v=${r.elapsed} max=${r.wall} /></span>
    <span class="mono">stall ${r.stall}/${r.stallMax} <${Bar} v=${r.stall} max=${r.stallMax} color=${r.stall ? 'var(--esc)' : ''} /></span>
    <span style=${{ marginLeft: 'auto' }}><${Actions} ctx=${ctx} /></span>
    ${r.stopReason && html`<div style=${{ width: '100%', color: 'var(--esc)' }} class="mono">STOP: ${r.stopReason}</div>`}
  </div>`;
}

/* grafo fisso, SVG disegnato a mano */

function TicketCard({ t, ctx }) {
  const isSel = ctx.sel?.kind === 'ticket' && ctx.sel.id === t.id;
  return html`<div class=${'clickable ' + (isSel ? 'sel' : '')} onClick=${() => ctx.select({ kind: 'ticket', id: t.id })}
    style=${{ border: '1px solid var(--border)', borderLeft: `3px solid ${COLORS[t.status]}`, borderRadius: '4px', padding: '4px 6px', marginBottom: '5px', background: 'var(--panel2)' }}>
    <div class="mono" style=${{ display: 'flex', justifyContent: 'space-between' }}><b>${t.id}</b><span class="muted">v${t.visit} ${usd(t.cost)}</span></div>
    <div style=${{ fontSize: '12px' }}>${t.title}</div>
    ${t.deps.length > 0 && html`<div class="muted mono" style=${{ fontSize: '11px' }}>dipende da ${t.deps.join(', ')}</div>`}
    ${t.note && html`<div style=${{ fontSize: '11px', color: COLORS[t.status] }}>${t.note}</div>`}
  </div>`;
}

function VerifyMatrix({ ctx, dense }) {
  const { data, select, sel } = ctx;
  const nR = Math.max(...data.scen.map(s => s.r.length));
  return html`<table class="mono" style=${{ fontSize: dense ? '11px' : '12px' }}>
    <thead><tr><th>AC</th><th>scenario</th>${!dense && html`<th></th>`}${Array.from({ length: nR }, (_, i) => html`<th>R${i + 1}</th>`)}</tr></thead>
    <tbody>${data.scen.map(s => html`<tr class=${'clickable ' + (sel?.id === s.id ? 'sel' : '')} onClick=${() => select({ kind: 'scenario', id: s.id })}>
      <td>${s.ac.join(' ')}</td><td>${s.id}${s.replay ? '' : html` <span class="muted" title="senza replay, guidato dall'agent">*</span>`}</td>
      ${!dense && html`<td class="muted" style=${{ fontFamily: 'inherit' }}>${s.title}</td>`}
      ${Array.from({ length: nR }, (_, i) => html`<td>${s.r[i]
        ? html`${s.gap?.includes(i + 1) && html`<${Pill} st="harness_gap" label="h-gap" />>`}<${Pill} st=${s.r[i]} label=${VERDICT_SHORT[s.r[i]]} />`
        : html`<span class="muted">-</span>`}</td>`)}
    </tr>`)}</tbody>
  </table>
  <div class="muted" style=${{ fontSize: '11px', marginTop: '4px' }}>* scenario senza replay, guidato dall'agent verify${data.run.status === 'running' ? ` - verify R${data.run.round} parte a coda vuota` : ''}</div>`;
}

function SideTabs({ ctx }) {
  const [tab, setTab] = useState('decisioni');
  const { data } = ctx;
  return html`<div class="panel" style=${{ height: '100%' }}>
    <div class="tabs">${['decisioni', 'stop/escalation', 'merge', 'eventi'].map(t => html`<button class=${tab === t ? 'on' : ''} onClick=${() => setTab(t)}>${t}</button>`)}</div>
    <div class="body">
      ${tab === 'decisioni' && html`<table>${data.decisions.map(d => html`<tr><td class="mono">${d.by}</td><td>${d.text} ${d.uncovered && html`<${Pill} st="esc" label="uncovered" />`}</td></tr>`)}</table>`}
      ${tab === 'stop/escalation' && html`<table>
        ${data.tickets.filter(t => t.status === 'escalated' || t.status === 'failed').map(t => html`<tr class="clickable" onClick=${() => ctx.select({ kind: 'ticket', id: t.id })}><td><${Pill} st=${t.status} /></td><td class="mono">${t.id}</td><td>${t.note}</td></tr>`)}
        ${data.stops.map(s => html`<tr><td><${Pill} st="budget" label=${s.level} /></td><td class="mono">${s.kind}</td><td>${s.text}</td></tr>`)}

      ${tab === 'merge' && html`<table class="mono">${data.merges.map(m => html`<tr><td>${m.wave}</td><td>${m.t}</td><td style=${{ color: m.ok ? 'var(--ok)' : 'var(--fail)' }}>${m.sha || 'abort'}</td><td class="muted" style=${{ fontFamily: 'inherit' }}>${m.note || 'merge --no-ff'}</td></tr>`)}</table>`}

}

function EventList({ ctx }) {
  return html`<table class="mono" style=${{ fontSize: '12px' }}>${[...ctx.data.events].reverse().map(([m, k, txt]) => html`<tr>
    <td class="muted">${clock(m)}</td><td style=${{ color: k === 'escalation' || k === 'stop' ? 'var(--esc)' : k === 'verdict' ? 'var(--running)' : 'var(--muted)' }}>${k}</td><td style=${{ fontFamily: 'inherit' }}>${txt}</td></tr>`)}</table>`;
}

/* dettaglio: contenuto dei tab per ticket / nodo / scenario */
function Detail({ ctx, onClose }) {
  const { data, sel, extra } = ctx;
  const [tab, setTab] = useState(null);
  if (!sel) return html`<div class="muted" style=${{ padding: '12px' }}>Seleziona un nodo, un ticket o uno scenario.</div>`;
  let title, tabs;
  if (sel.kind === 'ticket') {
    const t = data.tickets.find(x => x.id === sel.id);
    title = html`<b class="mono">${t.id}</b> ${t.title} <${Pill} st=${t.status} /> <span class="muted mono">v${t.visit} ${usd(t.cost)} claude/sonnet</span>`;
    tabs = {
      stream: html`<pre>${streamFor(t.id, extra).join('\n')}${t.status === 'implementing' ? '\n...' : ''}</pre>`,
      prompt: html`<pre>${`# Ticket ${t.id}: ${t.title}\nAC: ${t.ac.join(', ') || '-'}\nDipende da: ${t.deps.join(', ') || '-'}\n\n## Spec\n(notes-sharing.md, 2.1 KB)\n\n## contract.md\nRun: npm start, ready GET /health, porta 3000\nDrive: /notes, /s/:token, data-testid share-link, share-revoke ...\n\n## decisions.md (run)\n- SQLite (better-sqlite3)\n- Token 32 byte base64url, scadenza 7 giorni\n${t.visit > 1 ? '\n## Visita ' + t.visit + ': coda output test rossi\nFAIL share.expired.test.ts\n  expected 410, received 200' : ''}${t.kind === 'fix' ? '\n\n## Fix ticket (template engine)\nscenario: ' + t.title.split(':')[0].replace('fix ', '') + '\nmotivo: ' + t.title.split(': ')[1] : ''}`}</pre>`,
      response: html`<pre>${JSON.stringify({ status: t.status === 'escalated' ? 'blocked' : 'done', summary: t.note || `Implementato ${t.title}`, decisions: data.decisions.filter(d => d.by === t.id).map(d => d.text) }, null, 2)}</pre>`,
      diff: html`<pre style=${{ color: '#a8b1c2' }}>${'src/share/handler.ts   | 14 +++++++---\nsrc/share/token.ts     |  6 ++++\ntest/share.test.ts     | 22 ++++++++++++++\n\n@@ -12,7 +12,13 @@ export async function getShared(req, res) {\n   const share = await db.shares.byToken(req.params.token)\n-  if (!share) return res.status(404).end()\n+  if (!share) return res.status(404).end()\n+  if (share.expiresAt < Date.now()) {\n+    return res.status(410).json({ error: "expired" })\n+  }\n   const note = await db.notes.get(share.noteId)'}</pre>`,
      test: html`<pre>${t.status === 'failed' ? 'npm test  (exit 1)\n\nFAIL search.test.ts > full-text\n  Error: no such module: fts5\n\nTests: 1 failed, 41 passed' : 'npm test  (exit 0)\n\nTests: 42 passed\nTime: 8.1s'}</pre>`,
      visite: html`<table class="mono">${Array.from({ length: Math.max(1, t.visit) }, (_, i) => html`<tr><td>v${i + 1}</td><td>${i + 1 < t.visit ? html`<${Pill} st="fail" label="test rossi" />` : html`<${Pill} st=${t.status} />`}</td><td class="muted">sha ${(0x9a3f1 + i * 7919).toString(16)}</td><td>${usd(t.cost / Math.max(1, t.visit))}</td></tr>`)}</table>`,
    };
  } else if (sel.kind === 'node') {
    const p = data.pipe.find(x => x.id === sel.id);
    const st = p?.status || data.roundNodes[sel.id];
    const isTool = !p ? ['clone', 'test', 'merge', 'wave-test', 'ledger', 'route'].includes(sel.id) : p.type !== 'llm';
    title = html`<b class="mono">${sel.id}</b> <${Pill} st=${st} /> <span class="muted mono">${isTool ? 'tool - zero token' : (p?.harness || 'claude/opus')} ${p?.cost ? usd(p.cost) : ''}</span>`;
    tabs = isTool ? {
      log: html`<pre>${sel.id === 'merge' ? data.merges.map(m => `${m.wave}  ${m.t}  ${m.sha || 'ABORT'}  ${m.note || ''}`).join('\n') : `[${clock(141)}] ${sel.id} start\n[${clock(141)}] ${sel.id} end (exit 0)`}</pre>`,
      stato: html`<pre>${JSON.stringify({ node: sel.id, status: st, key: `notes-sharing/${sel.id}/r${data.run.round}` }, null, 2)}</pre>`,
    } : {
      stream: html`<pre>${`[${clock(0)}] tool Read spec/notes-sharing.md\n[${clock(1)}] tool Read contract.md\n[${clock(3)}] assistant: 7 AC, 2 senza driver UI (AC-6 email)\n[${clock(6)}] tool Write scenarios/notes-sharing/notes-01.md\n...`}</pre>`,
      prompt: html`<pre>${`prompts/${sel.id}.md\n\nSei nel container holdout-gen. Hai solo spec e contract.md.\nScrivi scenari con AC-id, replay Playwright con locator user-facing...`}</pre>`,
      response: html`<pre>${JSON.stringify({ scenarios: 8, replays: 6, uncovered_ac: [] }, null, 2)}</pre>`,
      costo: html`<table class="mono"><tr><td>harness</td><td>${p?.harness}</td></tr><tr><td>oracle</td><td>${p?.oracle}</td></tr><tr><td>token in/out</td><td>412k / 38k</td></tr><tr><td>costo</td><td>${usd(p?.cost || 0)}</td></tr><tr><td>durata</td><td>14m</td></tr></table>`,
    };
  } else {
    const s = data.scen.find(x => x.id === sel.id);
    title = html`<b class="mono">${s.id}</b> ${s.title} <span class="muted mono">${s.ac.join(' ')}</span>`;
    tabs = {
      verdetti: html`<table class="mono">${s.r.map((v, i) => html`<tr><td>R${i + 1}</td><td><${Pill} st=${v} /></td><td style=${{ fontFamily: 'inherit' }}>${v === 'pass' ? '-' : s.reason}</td></tr>`)}</table>`,
      evidenze: html`<div style=${{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>${[1, 2, 3].map(i => html`<div style=${{ width: '160px', height: '100px', border: '1px dashed var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} class="muted mono">step${i}.png</div>`)}
        <div class="muted mono" style=${{ width: '100%' }}>runs/${data.run.id}/evidence/${s.id}/  - trace.zip (apri in Playwright trace viewer)</div></div>`,
      replay: s.replay ? html`<pre>${`replays/notes-sharing/${s.id}.spec.ts  (hash ok)\n\nawait page.goto('/notes')\nawait page.getByRole('button', { name: 'Condividi' }).click()\nawait expect(page.getByTestId('share-link')).toBeVisible()`}</pre>` : html`<div class="muted">Nessun replay: guidato dall'agent con la skill verify.</div>`,
    };
  }
  const keys = Object.keys(tabs);
  const cur = keys.includes(tab) ? tab : keys[0];
  return html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
    <div style=${{ padding: '6px 10px', display: 'flex', gap: '8px', alignItems: 'center', borderBottom: '1px solid var(--border)' }}>
      <span style=${{ flex: 1 }}>${title}</span>${onClose && html`<button onClick=${onClose}>x</button>`}
    </div>
    <div class="tabs">${keys.map(k => html`<button class=${k === cur ? 'on' : ''} onClick=${() => setTab(k)}>${k}</button>`)}</div>
    <div style=${{ padding: '8px 10px', overflow: 'auto', flex: 1, minHeight: 0 }}>${tabs[cur]}</div>
  </div>`;
}

      <div class="panel"><h3>grafo</h3><div class="body"><${Graph} ctx=${ctx} /></div></div>
      <div class="panel"><h3>ticket - round ${round} <span class="muted" style=${{ textTransform: 'none' }}>(round precedenti: ${prev.filter(t => t.status === 'merged').length} merged)</span></h3>
        <div class="body" style=${{ display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0,1fr))', gap: '6px' }}>

          <div><div class="muted mono" style=${{ fontSize: '11px', marginBottom: '4px' }}><${Dot} st="fail" />failed / escalated</div>${data.tickets.filter(bad).map(t => html`<${TicketCard} t=${t} ctx=${ctx} />`)}</div>
        </div></div>

    <div style=${{ display: 'grid', gridTemplateColumns: 'minmax(0,1.3fr) minmax(0,1fr)', gap: '8px', minHeight: 0 }}>

/* ------------------------------------------------------------------ Variante B: timeline / gantt */

function VariantB({ ctx }) {
  const { data, sel, select } = ctx;
  const engineLanes = ['holdout-gen', 'tickets', 'merge', 'wave-test', 'review', 'verify', 'ledger', 'report'].filter(l => data.timeline.some(b => b.lane === l));
  const ticketLanes = data.tickets.map(t => t.id).filter(id => data.timeline.some(b => b.lane === id));
  const end = Math.max(data.run.elapsed, 60);
  const W = 1000, LANE = 22, LBL = 150;
  const x = m => LBL + (m / end) * (W - LBL - 10);
  const lanes = [...engineLanes, '__sep', ...ticketLanes];
  const H = lanes.length * LANE + 30;
  const ticks = []; for (let m = 0; m <= end; m += 30) ticks.push(m);
  const kindOf = id => data.tickets.some(t => t.id === id) ? 'ticket' : 'node';
  return html`<div style=${{ display: 'grid', gridTemplateRows: 'auto minmax(0,1fr) auto', gap: '8px', padding: '8px', height: '100vh', paddingBottom: '60px' }}>
    <${Header} ctx=${ctx} />
    <div style=${{ display: 'grid', gridTemplateColumns: 'minmax(0,1.7fr) minmax(360px,1fr)', gap: '8px', minHeight: 0 }}>
      <div class="panel"><h3>timeline del run <span class="muted" style=${{ textTransform: 'none' }}>- barre = visite, colore = esito, click = dettaglio</span></h3>
        <div class="body">
          <svg viewBox=${`0 0 ${W} ${H}`} style=${{ width: '100%' }}>
            ${data.rounds.map((r, i) => html`<rect x=${x(r.s)} y="0" width=${x(r.e ?? end) - x(r.s)} height=${H} fill=${i % 2 ? '#161a22' : '#1a1f29'} />
              <text x=${x(r.s) + 4} y="12" fill="#7d8596" font-size="10" font-family="ui-monospace,Menlo">round ${r.n}</text>`)}
            ${ticks.map(m => html`<line x1=${x(m)} x2=${x(m)} y1="16" y2=${H} stroke="#262b36" /><text x=${x(m) + 2} y=${H - 2} fill="#5b6373" font-size="9" font-family="ui-monospace,Menlo">${clock(m)}</text>`)}
            ${lanes.map((l, i) => {
              const y = 18 + i * LANE;
              if (l === '__sep') return html`<line x1="0" x2=${W} y1=${y + LANE / 2} y2=${y + LANE / 2} stroke="#3a4150" stroke-dasharray="3 3" />`;
              const t = data.tickets.find(tt => tt.id === l);
              const isSel = sel?.id === l;
              return html`<g class="clickable" onClick=${() => select({ kind: kindOf(l), id: l })}>
                <rect x="0" y=${y} width=${W} height=${LANE - 2} fill=${isSel ? '#1b2433' : 'transparent'} />
                <text x="6" y=${y + 14} fill=${t ? COLORS[t.status] : '#d6dae3'} font-size="11" font-family="ui-monospace,Menlo">${l}${t ? ' ' + t.title.slice(0, 16) : ''}</text>
                ${data.timeline.filter(b => b.lane === l).map(b => {
                  const e = b.e ?? data.run.elapsed;
                  return html`<rect x=${x(b.s)} y=${y + 3} width=${Math.max(2, x(e) - x(b.s) - 1)} height=${LANE - 8} rx="2" fill=${COLORS[b.st]} opacity=${b.st === 'running' ? 0.9 : 0.75}>
                    <title>${l} ${b.label || ''} ${clock(b.s)}-${clock(e)} ${b.st}</title></rect>`;
                })}
              </g>`;
            })}
            ${data.run.status === 'running' && html`<line x1=${x(data.run.elapsed)} x2=${x(data.run.elapsed)} y1="0" y2=${H} stroke="var(--running)" stroke-width="1.5" />`}
          </svg>
          <div class="muted" style=${{ fontSize: '11px' }}>sopra la linea tratteggiata: nodi engine; sotto: ticket. Costo cumulato ${usd(data.run.cost)}.</div>
        </div></div>
      <div class="panel"><${Detail} ctx=${ctx} /></div>
    </div>
    <div class="panel"><h3>holdout</h3><div class="body" style=${{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
      ${data.scen.map(s => html`<span class=${'clickable mono ' + (sel?.id === s.id ? 'sel' : '')} onClick=${() => select({ kind: 'scenario', id: s.id })}
        style=${{ border: '1px solid var(--border)', borderRadius: '4px', padding: '3px 6px', display: 'flex', gap: '3px', alignItems: 'center' }}>
        ${s.id} ${s.r.map(v => html`<span title=${v} style=${{ width: '10px', height: '10px', borderRadius: '2px', background: COLORS[v], display: 'inline-block' }}></span>`)}
      </span>`)}
    </div></div>
  </div>`;
}

/* ------------------------------------------------------------------ Variante C: inbox "cosa richiede attenzione" */

function VariantC({ ctx }) {
  const { data, sel, select } = ctx;
  const r = data.run;
  const last = s => s.r[s.r.length - 1];
  const groups = [
    { name: 'Richiede te', st: 'esc', items: data.tickets.filter(t => t.status === 'escalated').map(t => ({ kind: 'ticket', id: t.id, txt: t.note, sub: t.title })) },
    { name: 'Scenari non verdi', st: 'fail', items: data.scen.filter(s => last(s) !== 'pass').map(s => ({ kind: 'scenario', id: s.id, txt: `${last(s)}: ${s.reason}`, sub: s.title, streak: s.r.filter(v => v === last(s)).length })) },
    { name: 'Ticket falliti', st: 'fail', items: data.tickets.filter(t => t.status === 'failed').map(t => ({ kind: 'ticket', id: t.id, txt: t.note, sub: t.title })) },
    { name: 'In corso', st: 'running', items: data.tickets.filter(t => ['implementing', 'tested', 'queued'].includes(t.status)).map(t => ({ kind: 'ticket', id: t.id, txt: `${t.status} v${t.visit}`, sub: t.title })) },
    { name: 'Decisioni uncovered', st: 'esc', items: data.decisions.filter(d => d.uncovered).map(d => ({ kind: 'ticket', id: d.by, txt: d.text, sub: 'decisione' })) },
    { name: 'Fatto', st: 'ok', collapsed: true, items: data.tickets.filter(t => t.status === 'merged').map(t => ({ kind: 'ticket', id: t.id, txt: `merged v${t.visit} ${usd(t.cost)}`, sub: t.title })) },
  ];
  const [open, setOpen] = useState({ Fatto: false });
  const green = data.scen.filter(s => last(s) === 'pass').length;
  const headline = r.status === 'running' || r.status === 'paused'
    ? `In corso: round ${r.round}/${r.maxRounds}, ${data.tickets.filter(t => t.status === 'implementing').length} agent al lavoro`
    : r.status === 'aborted' ? 'Abortito manualmente, nessun merge' : 'Fermato senza merge su main';
  const steps = ['spec-gate', 'holdout-gen', 'tickets', ...Array.from({ length: r.maxRounds }, (_, i) => 'R' + (i + 1)), 'regression', 'merge-main', 'report'];
  const stepSt = s => {
    if (s.startsWith('R') && s.length <= 2) { const n = +s.slice(1); return n < r.round ? 'ok' : n === r.round ? (r.status === 'running' ? 'running' : 'esc') : 'pending'; }
    return data.pipe.find(p => p.id === s)?.status;
  };
  return html`<div style=${{ display: 'grid', gridTemplateRows: 'auto auto minmax(0,1fr)', gap: '10px', padding: '14px 18px', height: '100vh', paddingBottom: '60px', maxWidth: '1400px', margin: '0 auto' }}>
    <div style=${{ display: 'flex', alignItems: 'flex-end', gap: '24px', flexWrap: 'wrap' }}>
      <div style=${{ flex: 1 }}>
        <div class="muted mono">${r.project} / ${r.spec} - run ${r.id} - ${r.branch}</div>
        <div style=${{ fontSize: '24px', fontWeight: 600, color: r.status === 'running' ? 'var(--text)' : 'var(--esc)' }}>${headline}</div>
        ${r.stopReason && html`<div class="mono" style=${{ color: 'var(--esc)' }}>${r.stopReason}</div>`}
      </div>
      ${[['holdout verdi', `${green}/${data.scen.length}`], ['costo', `${usd(r.cost)} / ${r.budget}`], ['durata', `${dur(r.elapsed)} / ${dur(r.wall)}`], ['$ / scenario verde', usd(r.cost / Math.max(1, green))]].map(([k, v]) => html`
        <div style=${{ textAlign: 'right' }}><div class="muted" style=${{ fontSize: '11px' }}>${k}</div><div class="mono" style=${{ fontSize: '18px' }}>${v}</div></div>`)}
      <${Actions} ctx=${ctx} />
    </div>
    <div style=${{ display: 'flex', gap: '2px' }}>${steps.map(s => html`<div class="clickable" onClick=${() => !s.match(/^R\d$/) && select({ kind: 'node', id: s })} title=${s}
      style=${{ flex: s.match(/^R\d$/) ? 1 : 1.4, padding: '4px 6px', background: 'var(--panel)', borderTop: `3px solid ${COLORS[stepSt(s)] || 'var(--pending)'}`, fontSize: '11px' }} class="mono">${s}</div>`)}</div>
    <div style=${{ display: 'grid', gridTemplateColumns: 'minmax(320px,0.9fr) minmax(0,1.6fr)', gap: '10px', minHeight: 0 }}>
      <div class="panel"><div class="body" style=${{ padding: 0 }}>
        ${groups.filter(g => g.items.length).map(g => html`<div>
          <div class="clickable" onClick=${() => setOpen({ ...open, [g.name]: !(open[g.name] ?? !g.collapsed) })}
            style=${{ padding: '8px 10px', fontSize: '11px', textTransform: 'uppercase', letterSpacing: '.06em', color: COLORS[g.st], borderBottom: '1px solid var(--border)', background: 'var(--panel2)' }}>
            ${g.name} (${g.items.length})</div>
          ${(open[g.name] ?? !g.collapsed) && g.items.map(it => html`<div class=${'clickable ' + (sel?.id === it.id ? 'sel' : '')} onClick=${() => select({ kind: it.kind, id: it.id })}
            style=${{ padding: '6px 10px', borderBottom: '1px solid var(--border)' }}>
            <div><b class="mono">${it.id}</b> <span class="muted">${it.sub}</span>${it.streak > 1 ? html` <span class="pill" style=${{ background: 'var(--esc)', color: '#000' }}>${it.streak} round</span>` : ''}</div>
            <div style=${{ fontSize: '12px' }}>${it.txt}</div>
          </div>`)}
        </div>`)}
      </div></div>
      <div class="panel">${sel ? html`<${Detail} ctx=${ctx} />` : html`<div class="body"><h4 style=${{ margin: '0 0 6px' }}>Ultimi eventi</h4><${EventList} ctx=${ctx} /></div>`}</div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ app + switcher */

const VARIANTS = [['A', 'Dashboard a griglia', VariantA], ['B', 'Timeline / gantt', VariantB], ['C', 'Inbox attenzione', VariantC]];
const qp = new URLSearchParams(location.search);

function App() {
  const [variant, setVariant] = useState(qp.get('variant') || 'A');
  const [mode, setMode] = useState(qp.get('mode') || 'live');
  const [sel, select] = useState(null);
  const [ctrl, setCtrl] = useState(null); // pause | abort
  const [tick, setTick] = useState(0);
  const [extra, setExtra] = useState({});
  const [showState, setShowState] = useState(false);

  useEffect(() => {
    const p = new URLSearchParams(location.search); p.set('variant', variant); p.set('mode', mode);
    history.replaceState(null, '', '?' + p);
  }, [variant, mode]);

  // simulazione live: avanza tempo, costo e stream degli agent in corso
  useEffect(() => {
    if (mode !== 'live' || ctrl) return;
    const h = setInterval(() => {
      setTick(t => t + 1);
      setExtra(ex => {
        const n = { ...ex };
        ['F-1', 'F-3', 'R-1'].forEach(id => {
          const arr = n[id] || [];
          if (arr.length < STREAM_POOL.length - 5) n[id] = [...arr, `[${clock(146 + arr.length)}] ${STREAM_POOL[5 + arr.length]}`];
        });
        return n;
      });
    }, 1500);
    return () => clearInterval(h);
  }, [mode, ctrl]);

  useEffect(() => {
    const k = e => {
      if (e.target.closest('input,textarea,[contenteditable]')) return;
      const i = VARIANTS.findIndex(v => v[0] === variant);
      if (e.key === 'ArrowRight') setVariant(VARIANTS[(i + 1) % VARIANTS.length][0]);
      if (e.key === 'ArrowLeft') setVariant(VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length][0]);
      if (e.key === 'Escape') select(null);
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [variant]);

  const data = mode === 'done' ? doneData() : baseData();
  if (mode === 'live') {
    data.run.elapsed += tick * 0.05; data.run.cost += tick * 0.004;
    if (ctrl === 'pause') data.run.status = 'paused';
    if (ctrl === 'abort') { data.run.status = 'aborted'; data.run.stopReason = 'abort manuale: container fermati, nessun merge'; }
    if (ctrl) data.events.push([data.run.elapsed, 'control.ack', ctrl === 'pause' ? 'pausa: attendo fine nodi in corso (F-1, F-3, R-1)' : ctrl]);
  }
  const act = a => setCtrl(a === 'resume' ? null : a);
  const ctx = { data, sel, select, act, extra };
  const [key, name, V] = VARIANTS.find(v => v[0] === variant) || VARIANTS[0];
  const cyc = d => { const i = VARIANTS.findIndex(v => v[0] === key); setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]); };

  return html`
    <${V} ctx=${ctx} />
    ${showState && html`<div id="statebox"><pre>${JSON.stringify({ variant: key, mode, sel, ctrl, run: data.run }, null, 2)}</pre></div>`}
    <div id="switcher">
      <button onClick=${() => cyc(-1)}>${'<'}</button>
      <span class="lbl">${key} (${name})</span>
      <button onClick=${() => cyc(1)}>${'>'}</button>
      <span>|</span>
      <button class=${mode === 'live' ? 'on' : ''} onClick=${() => { setMode('live'); setCtrl(null); }}>live</button>
      <button class=${mode === 'done' ? 'on' : ''} onClick=${() => setMode('done')}>mattino</button>
      <button class=${showState ? 'on' : ''} onClick=${() => setShowState(!showState)}>stato</button>
    </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
